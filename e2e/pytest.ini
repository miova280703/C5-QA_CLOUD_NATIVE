[pytest]
# Donde viven los steps (step definitions de pytest-bdd)
testpaths = steps
# Donde pytest-bdd busca los .feature (Gherkin)
bdd_features_base_dir = features
markers =
    catalogo: casos de la suite Catalogo
    carrito: casos de la suite Carrito
    pedidos: casos de la suite Pedidos
    borde: casos de borde (propuestos con IA)
addopts = -v --tb=short
